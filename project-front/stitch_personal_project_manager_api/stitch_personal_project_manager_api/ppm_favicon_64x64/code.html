<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="favIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Favicon Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)" stroke="url(#borderGrad)" stroke-width="1.75"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="32" r="16" fill="#6366f1" opacity="0.3" filter="url(#favGlow)"/>

  <!-- Precision Isometric Hexagon Prism -->
  <!-- Top Facet -->
  <path d="M32 15 L48 24.2 L32 33.4 L16 24.2 Z" fill="url(#favCyan)"/>
  <!-- Left Facet -->
  <path d="M16 24.2 L32 33.4 V51.8 L16 42.6 Z" fill="url(#favIndigo)"/>
  <!-- Right Facet -->
  <path d="M32 33.4 L48 24.2 V42.6 L32 51.8 Z" fill="#3730a3"/>

  <!-- Inner Prism Structure Lines -->
  <path d="M32 33.4 V51.8" stroke="#6366f1" stroke-width="1" opacity="0.6"/>
  
  <!-- Central Luminous Core -->
  <circle cx="32" cy="33.4" r="3.2" fill="#ffffff" filter="url(#favGlow)"/>
  <circle cx="32" cy="33.4" r="1.6" fill="#38bdf8"/>
  
  <!-- Vertices Accents -->
  <circle cx="32" cy="15" r="1.5" fill="#ffffff"/>
  <circle cx="48" cy="24.2" r="1.5" fill="#38bdf8"/>
  <circle cx="48" cy="42.6" r="1.5" fill="#818cf8"/>
  <circle cx="32" cy="51.8" r="1.5" fill="#a5b4fc"/>
  <circle cx="16" cy="42.6" r="1.5" fill="#818cf8"/>
  <circle cx="16" cy="24.2" r="1.5" fill="#38bdf8"/>
</svg>
